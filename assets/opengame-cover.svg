<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540">
  <title>OpenGame</title>
  <desc>A clean ivory and champagne background with soft golden light and a white glass surface.</desc>
  <defs>
    <linearGradient id="ivory" x2="1" y2="1">
      <stop stop-color="#f4f1e8"/>
      <stop offset="1" stop-color="#fbf9f2"/>
    </linearGradient>
    <radialGradient id="champagne" cx="82%" cy="78%" r="85%">
      <stop stop-color="#e9d4aa" stop-opacity=".7"/>
      <stop offset=".5" stop-color="#efe1c4" stop-opacity=".45"/>
      <stop offset="1" stop-color="#efe1c4" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="white-light" cx="60%" cy="12%" r="70%">
      <stop stop-color="#fff" stop-opacity=".9"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="glass" x2="0" y2="1">
      <stop stop-color="#fff" stop-opacity=".45"/>
      <stop offset="1" stop-color="#fff" stop-opacity=".25"/>
    </linearGradient>
  </defs>
  <path fill="url(#ivory)" d="M0 0h960v540H0z"/>
  <path fill="url(#champagne)" d="M0 0h960v540H0z"/>
  <path fill="url(#white-light)" d="M0 0h960v540H0z"/>
  <path fill="url(#glass)" d="M0 0h960v540H0z"/>
</svg>
